% Axisymmetric compressible RANS of a straight pipe (x = axis, y = radius)
SOLVER= RANS
KIND_TURB_MODEL= SA
MATH_PROBLEM= DIRECT
RESTART_SOL= {restart}
AXISYMMETRIC= YES

% ---- air, ISA sea level; initial field = inlet state
FLUID_MODEL= STANDARD_AIR
GAMMA_VALUE= 1.4
GAS_CONSTANT= 287.058
VISCOSITY_MODEL= SUTHERLAND
SUTHERLAND_CONSTANT= 110.4
MU_REF= 1.716E-5
MU_T_REF= 273.15
CONDUCTIVITY_MODEL= CONSTANT_PRANDTL
PRANDTL_LAM= 0.72
PRANDTL_TURB= 0.90
MACH_NUMBER= {mach}
AOA= 0.0
INIT_OPTION= TD_CONDITIONS
FREESTREAM_OPTION= TEMPERATURE_FS
FREESTREAM_PRESSURE= {p_static}
FREESTREAM_TEMPERATURE= {t_static}
FREESTREAM_NU_FACTOR= 3.0
REF_DIMENSIONALIZATION= DIMENSIONAL
REF_ORIGIN_MOMENT_X= 0.0
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= {D}
REF_AREA= 1.0

% ---- boundaries
MARKER_HEATFLUX= ( wall, 0.0 )
MARKER_SYM= ( axis )
INLET_TYPE= TOTAL_CONDITIONS
MARKER_INLET= ( inlet, {t_total}, {p_total}, 1.0, 0.0, 0.0 )
MARKER_OUTLET= ( outlet, {p_out} )
MARKER_PLOTTING= ( wall )
MARKER_MONITORING= ( wall )
MARKER_ANALYZE= ( inlet, outlet )
MARKER_ANALYZE_AVERAGE= AREA

% ---- numerics
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 2.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.05, 1.0, 50.0 )
ITER= {iters}
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 10
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= {muscl}
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
TIME_DISCRE_TURB= EULER_IMPLICIT

% ---- convergence
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -11
CONV_STARTITER= 50

% ---- I/O
MESH_FILENAME= pipe.su2
MESH_FORMAT= SU2
SOLUTION_FILENAME= restart_flow.dat
RESTART_FILENAME= restart_flow.dat
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
OUTPUT_FILES= (RESTART_ASCII, PARAVIEW, SURFACE_CSV)
TABULAR_FORMAT= CSV
CONV_FILENAME= history
SCREEN_OUTPUT= (INNER_ITER, RMS_DENSITY, RMS_NU_TILDE, SURFACE_MACH, SURFACE_STATIC_PRESSURE)
HISTORY_OUTPUT= (ITER, RMS_RES, FLOW_COEFF, FLOW_COEFF_SURF)
SCREEN_WRT_FREQ_INNER= 100
OUTPUT_WRT_FREQ= 1000
